name: Deploy FastAPI to Cloud

on:
  push:
    branches:
      - main  # Se a sua branch principal tiver outro nome (ex: master), mude aqui

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Os passos abaixo conectam com o seu provedor de nuvem (como Azure App Services)
    # usando as credenciais que configuramos nos Secrets do GitHub.